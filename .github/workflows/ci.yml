name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install Vulkan (Linux)
        # Ubuntu 24.04 ships headers 1.3.275 and the constants table is generated from 1.4.309,
        # so the Khronos headers go in over the distribution's; the loader stays apt's.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake libvulkan-dev
          curl -fsSL https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.309.tar.gz | tar -xz -C /tmp
          cmake -S /tmp/Vulkan-Headers-1.4.309 -B /tmp/vulkan-headers-build
          sudo cmake --install /tmp/vulkan-headers-build

      - name: Install Vulkan (macOS)
        if: runner.os == 'macOS'
        run: brew install vulkan-loader vulkan-headers molten-vk pkgconf

      - name: Build
        run: |
          phpize
          ./configure --enable-vulkan
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Load
        run: |
          php -n -d extension="$PWD/modules/vulkan.so" -r 'exit(extension_loaded("vulkan") ? 0 : 1);'
          php -n -d extension="$PWD/modules/vulkan.so" --ri vulkan
